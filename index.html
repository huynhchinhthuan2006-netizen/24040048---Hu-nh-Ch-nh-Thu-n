<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Giới thiệu cá nhân</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #263238;
      --muted: #65727a;
      --accent: #087eae;
      --paper: #ffffff;
      --wash: #e7f4fa;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px 18px;
      background: linear-gradient(145deg, #e5f4fb, #f4f8fc);
      color: var(--ink);
      font-family: "Segoe UI", Arial, sans-serif;
    }
    main {
      width: min(100%, 680px);
      padding: clamp(28px, 6vw, 52px);
      background: var(--paper);
      border: 1px solid rgba(8, 126, 174, .14);
      border-radius: 22px;
      box-shadow: 0 18px 50px rgba(26, 85, 115, .12);
    }
    .eyebrow {
      margin: 0 0 10px;
      color: var(--accent);
      font-size: .78rem;
      font-weight: 700;
      letter-spacing: .13em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      font-size: clamp(2rem, 7vw, 3.25rem);
      line-height: 1.12;
      letter-spacing: -.04em;
    }
    .rule {
      width: 56px;
      height: 4px;
      margin: 24px 0 30px;
      border-radius: 99px;
      background: var(--accent);
    }
    section {
      padding: 19px 0;
      border-top: 1px solid #e2edf2;
    }
    h2 {
      margin: 0 0 8px;
      color: var(--muted);
      font-size: .82rem;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    p {
      margin: 0;
      font-size: 1.08rem;
      line-height: 1.65;
    }
    .tags { display: flex; flex-wrap: wrap; gap: 9px; }
    .tag {
      padding: 7px 12px;
      border-radius: 999px;
      background: var(--wash);
      color: #08658c;
      font-size: .95rem;
    }
    footer {
      margin-top: 28px;
      padding-top: 18px;
      border-top: 1px solid #e2edf2;
      color: var(--muted);
      font-size: .88rem;
      text-align: center;
    }
    @media (max-width: 420px) {
      body { padding: 18px 12px; }
      main { border-radius: 16px; }
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Giới thiệu</p>
    <h1>Huỳnh Chính Thuần</h1>
    <div class="rule" aria-hidden="true"></div>

    <section>
      <h2>Chuyên ngành</h2>
      <p>Quan Hệ Công Chúng</p>
    </section>

    <section>
      <h2>Kỹ năng</h2>
      <div class="tags">
        <span class="tag">Xây Dựng Kịch Bản</span>
        <span class="tag">Sử dụng A.I</span>
      </div>
    </section>

    <section>
      <h2>Mục tiêu nghề nghiệp</h2>
      <p>KOLs</p>
    </section>
    <footer>Được tạo bằng Codex.</footer>
  </main>
</body>
</html>
